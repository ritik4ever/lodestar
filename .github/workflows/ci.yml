name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Soroban contract: build + test ─────────────────────────────────────
  contract-build:
    name: Contract build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32v1-none
          components: rustfmt

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
            contract/agents/target
          key: rust-${{ runner.os }}-${{ hashFiles('contract/Cargo.lock', 'contract/agents/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Check Rust formatting
        working-directory: contract
        run: cargo fmt --all --check

      - name: Install system dependencies for stellar-cli
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libssl-dev libudev-dev

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Build registry contract
        working-directory: contract
        run: |
          rustup target add wasm32v1-none
          stellar contract build

      - name: Test registry contract
        working-directory: contract
        run: cargo test

      - name: Build agents contract
        working-directory: contract/agents
        run: |
          rustup target add wasm32v1-none
          stellar contract build

      - name: Test agents contract
        working-directory: contract/agents
        run: cargo test

      - name: Test WASM size checker
        run: node --test scripts/check-wasm-size.test.mjs

      - name: Build base contracts for size comparison
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach /tmp/lodestar-base "$BASE_SHA"

          (
            cd /tmp/lodestar-base/contract
            stellar contract build
          )
          (
            cd /tmp/lodestar-base/contract/agents
            stellar contract build
          )

          mkdir -p /tmp/lodestar-base-wasm
          cp /tmp/lodestar-base/contract/target/wasm32v1-none/release/lodestar_registry.wasm \
            /tmp/lodestar-base-wasm/lodestar_registry.wasm
          cp /tmp/lodestar-base/contract/agents/target/wasm32v1-none/release/lodestar_agents.wasm \
            /tmp/lodestar-base-wasm/lodestar_agents.wasm

      - name: Check and report contract WASM sizes
        env:
          MAX_WASM_SIZE_BYTES: 131072
        run: |
          set -euo pipefail
          arguments=(
            --current-registry contract/target/wasm32v1-none/release/lodestar_registry.wasm
            --current-agents contract/agents/target/wasm32v1-none/release/lodestar_agents.wasm
            --metrics wasm-size-metrics.json
          )

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            arguments+=(
              --base-registry /tmp/lodestar-base-wasm/lodestar_registry.wasm
              --base-agents /tmp/lodestar-base-wasm/lodestar_agents.wasm
            )
          fi

          node scripts/check-wasm-size.mjs "${arguments[@]}"

      - name: Upload WASM size history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-size-${{ github.run_id }}-${{ github.run_attempt }}
          path: wasm-size-metrics.json
          if-no-files-found: warn
          retention-days: 90

  # ── Backend: test ─────────────────────────────────────────────────────
  backend-test:
    name: Backend test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'


      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        run: npm test

  # ── Frontend: type-check + build ──────────────────────────────────────
  frontend-typecheck:
    name: Frontend type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'


      - name: Install dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Run tests
        working-directory: frontend
        run: npm test -- --passWithNoTests

  # ── Agent: test ───────────────────────────────────────────────────────
  agent-test:
    name: Agent test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        working-directory: agent
        run: npm ci

      - name: Run tests
        working-directory: agent
        run: npm test
